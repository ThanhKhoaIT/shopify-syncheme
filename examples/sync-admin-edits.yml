# Copy to .github/workflows/sync-admin-edits.yml in your theme repository.
name: Sync admin edits

on:
  schedule:
    # Cron is UTC. Vietnam (ICT) is UTC+7.
    - cron: "5 1-13 * * 1-5"     # Mon–Fri, hourly 08:05–20:05 ICT
    - cron: "5 1-13/4 * * 0,6"   # Sat–Sun, 08:05 / 12:05 / 16:05 / 20:05 ICT
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    uses: ThanhKhoaIT/shopify-syncheme/.github/workflows/sync.yml@v1
    with:
      store: your-store
      theme-path: .
      # environment: production   # use the same shopify.theme.toml environment as your local pulls
    secrets:
      SHOPIFY_THEME_ACCESS_PASSWORD: ${{ secrets.SHOPIFY_THEME_ACCESS_PASSWORD }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}   # optional
